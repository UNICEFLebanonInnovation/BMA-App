name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          flutter build apk --$TYPE
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-$TYPE.apk "dist/bma-app-$TYPE-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bma-app-apk
          path: dist/*.apk
          retention-days: 90
