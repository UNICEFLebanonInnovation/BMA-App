name: Release

# Publishes the Android APK as a GitHub release asset, which gives a permanent
# download link that needs no GitHub account (this repository is public).
#
# Two ways in:
#   * a version tag, for a real release:  git tag v0.1.0 && git push origin v0.1.0
#   * a push to the field-test branch, which refreshes the rolling `field-test`
#     pre-release so partners always have the newest build at the same link.

on:
  push:
    tags: ['v*']
    branches: ['claude/kind-brahmagupta-j47zvz']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (field-test build)'
        default: true
        type: boolean

permissions:
  contents: write

# A newer push supersedes a release build that is still running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            ROLLING=false
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            ROLLING=false
          else
            # Rolling build of the field-test branch: same tag every time, so
            # the download link stays valid.
            TAG="field-test"
            ROLLING=true
          fi
          if [[ ! "$TAG" =~ ^(v[0-9A-Za-z.\-]+|field-test)$ ]]; then
            echo "::error::Tag '$TAG' must look like v0.1.0"
            exit 1
          fi
          if [[ "$ROLLING" == "true" ]]; then
            APK="bma-app-field-test-${GITHUB_SHA::7}.apk"
          else
            APK="bma-app-$TAG.apk"
          fi
          {
            echo "tag=$TAG"
            echo "apk=$APK"
            echo "rolling=$ROLLING"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A release only goes out on green code.
      - run: flutter analyze --no-pub
      - run: flutter test

      - name: Build the release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.meta.outputs.apk }}"
          cd dist && sha256sum "${{ steps.meta.outputs.apk }}" > "${{ steps.meta.outputs.apk }}.sha256"

      - name: Write the release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          Android build of the BMA-NFE offline mobile app.

          ## Install

          1. Download the `.apk` below on the phone or tablet.
          2. Allow installation from unknown sources when Android asks.
          3. Open the app, enter the address of your BMA-NFE server on the
             **Set up the server** page, then sign in with a BMA-NFE account.

          The server must run the `student_registration.mobile_api` app. Use
          **Test connection** on the setup page to confirm before signing in.

          ## Notes

          - This APK is signed with the Android debug key so it installs on any
            device for field testing. It is not a Play Store build, and it
            cannot be installed over a copy signed with a different key.
          - Verify the download against the `.sha256` file published beside it.
          NOTES
          if [[ "${{ steps.meta.outputs.rolling }}" == "true" ]]; then
            {
              echo ""
              echo "This is a rolling field-test build: it is replaced by the"
              echo "newest commit on the branch, and the download link stays"
              echo "the same."
            } >> dist/notes.md
          fi
          {
            echo ""
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
          } >> dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ROLLING: ${{ steps.meta.outputs.rolling }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          # The rolling release is recreated so its tag follows the branch head.
          if [[ "$ROLLING" == "true" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          FLAGS=()
          if [[ "$ROLLING" == "true" || "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          if [[ "$ROLLING" == "true" ]]; then
            TITLE="BMA Mobile field-test build"
          else
            TITLE="BMA Mobile $TAG"
          fi
          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.apk }}" \
            "dist/${{ steps.meta.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file dist/notes.md \
            "${FLAGS[@]}"
          echo "### [$TITLE](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
