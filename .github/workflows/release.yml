name: Release

# Publishes the Android APK as a GitHub release asset, which gives a permanent
# download link that needs no GitHub account (this repository is public).
#
# The asset is always called `bma-app.apk`, so the rolling pre-release serves
# the newest build of `main` at a URL that never changes:
#
#   https://github.com/<owner>/<repo>/releases/download/field-test/bma-app.apk
#
# Three ways in:
#   * every push to `main`, which refreshes that rolling `field-test` release
#   * a version tag, for a numbered release:  git tag v0.1.0 && git push origin v0.1.0
#   * **Run workflow** by hand: no tag refreshes the rolling release, a tag cuts
#     a numbered one.

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for a numbered release, e.g. v0.1.0. Leave empty to refresh the rolling field-test build.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release (the rolling build is always one)'
        default: true
        type: boolean

permissions:
  contents: write

# A newer push supersedes a release build that is still running.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            ROLLING=false
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            ROLLING=false
          else
            # Rolling build of `main`: same tag every time, so the download
            # link stays valid.
            TAG="field-test"
            ROLLING=true
          fi
          if [[ ! "$TAG" =~ ^(v[0-9A-Za-z.\-]+|field-test)$ ]]; then
            echo "::error::Tag '$TAG' must look like v0.1.0"
            exit 1
          fi
          # Asking for `field-test` by hand means the rolling build, which
          # replaces the existing release rather than failing to create it.
          if [[ "$TAG" == "field-test" ]]; then
            ROLLING=true
          fi
          # One filename for every build, so the download URL is the same every
          # time. The release notes name the commit it was built from.
          APK="bma-app.apk"
          {
            echo "tag=$TAG"
            echo "apk=$APK"
            echo "rolling=$ROLLING"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A release only goes out on green code.
      - run: flutter analyze --no-pub
      - run: flutter test

      # A tester installs the new APK over the old one only when both carry the
      # same signature. The Android debug key cannot do that here: the Gradle
      # plugin generates it the first time it is missing, and every runner is a
      # fresh machine, so each build would be signed by a different key and the
      # install would fail with INSTALL_FAILED_UPDATE_INCOMPATIBLE. The four
      # secrets below hold the project's own key; README.md, "Signing the
      # field-test APK", has the one-time setup.
      - name: Set up the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret is set, so this APK is signed with a throwaway debug key. Testers must uninstall the previous build before installing it."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.meta.outputs.apk }}"
          cd dist && sha256sum "${{ steps.meta.outputs.apk }}" > "${{ steps.meta.outputs.apk }}.sha256"

      # The key has done its job; nothing after this step needs it on disk.
      - name: Remove the signing key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Write the release notes
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          cat > dist/notes.md <<'NOTES'
          Android build of the BMA-NFE offline mobile app.

          ## Install

          1. Download the `.apk` below on the phone or tablet.
          2. Allow installation from unknown sources when Android asks.
          3. Open the app, enter the address of your BMA-NFE server on the
             **Set up the server** page, then sign in with a BMA-NFE account.

          The server must run the `student_registration.mobile_api` app. Use
          **Test connection** on the setup page to confirm before signing in.

          ## Notes

          NOTES
          # What the device does when this build meets an earlier one depends on
          # which key signed it, so the notes have to say which that was.
          if [[ "$SIGNED" == "release" ]]; then
            {
              echo "- This APK is signed with the project's field-test key, so it installs"
              echo "  straight over an earlier build from this link and keeps the data"
              echo "  already on the device. It is not a Play Store build."
            } >> dist/notes.md
          else
            {
              echo "- **This APK is signed with a throwaway debug key.** Android refuses to"
              echo "  install it over an earlier build, and uninstalling that one erases any"
              echo "  registrations it has not yet synchronised. Setting the repository's"
              echo "  signing secrets fixes this for every build after it."
            } >> dist/notes.md
          fi
          echo "- Verify the download against the \`.sha256\` file published beside it." >> dist/notes.md
          if [[ "${{ steps.meta.outputs.rolling }}" == "true" ]]; then
            {
              echo ""
              echo "This is a rolling field-test build: every push to \`main\`"
              echo "replaces it, and the download link stays the same."
            } >> dist/notes.md
          fi
          {
            echo ""
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
          } >> dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ROLLING: ${{ steps.meta.outputs.rolling }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          # The rolling release is recreated so its tag follows the branch head.
          if [[ "$ROLLING" == "true" ]] && gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          FLAGS=()
          if [[ "$ROLLING" == "true" || "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          if [[ "$ROLLING" == "true" ]]; then
            TITLE="BMA Mobile field-test build"
          else
            TITLE="BMA Mobile $TAG"
          fi
          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.apk }}" \
            "dist/${{ steps.meta.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file dist/notes.md \
            "${FLAGS[@]}"
          echo "### [$TITLE](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
