name: bma_app
description: "BMA-NFE mobile companion: offline-first registration, services and attendance for the NFE sector, synchronised with the BMA-NFE platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI (no code generation required)
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secure token storage and preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Connectivity awareness for the sync engine
  connectivity_plus: ^6.1.0

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  collection: ^1.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
